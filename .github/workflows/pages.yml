name: Deploy static site to GitHub Pages

# Publishes the static build (sample songs + Sonivox only, never a private
# collection) to https://xilcmd.github.io/guitarz/ on every merge to master.
# All app paths are page-relative (#14), so the site works in that folder.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push waits rather than cancelling a live deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Fetch alphaTab (core only, ~7 MB)
        run: ./scripts/fetch_vendor.sh --core
      - name: Build the static site
        # The builder uses only the standard library; no install needed.
        run: python -m guitarz.static_build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
