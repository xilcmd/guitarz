name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      # Only "test (ubuntu-latest, 3.13)" blocks a merge; the rest are
      # informational. With the default fail-fast, one informational job
      # failing would CANCEL the required one, which then reports "fail"
      # without ever having run — so fail-fast stays off.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check guitarz/ tests/
      # The headless-Chrome smoke tests need the vendored alphaTab assets and
      # songs from the private ~/gps collection, neither of which exists on a
      # runner, so they skip themselves here; they run on the dev machine.
      - name: Run tests
        run: pytest tests/ -v --tb=short -rs
