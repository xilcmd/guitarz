[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guitarz"
version = "0.1.0"
description = "Conductor-view Guitar Pro player: every track as tablature with synced SoundFont playback"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pyguitarpro>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "websockets>=12",
    "ruff>=0.15",
]

[project.scripts]
guitarz = "guitarz.__main__:main"
gpinfo = "guitarz.gpinfo:main"

[tool.setuptools]
packages = ["guitarz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "browser: end-to-end test driving headless Chrome (auto-skipped when Chrome is unavailable)",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = [
    "E501",   # line-too-long (relaxed to 120 via line-length above)
    "E741",   # ambiguous variable name (single-char vars fine in context)
]

[tool.ruff.lint.isort]
known-first-party = ["guitarz"]
